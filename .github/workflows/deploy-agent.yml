name: Deploy Agent to Modal

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install agent dependencies
        # `modal deploy` imports modal_app.py locally to build the app graph,
        # so the agent's module-level deps (structlog, openai-agents, composio,
        # modal, …) must be present in CI — not just `modal`. Installing only
        # `modal` previously made every deploy crash on `import structlog`.
        working-directory: agent
        run: uv pip install --system -r pyproject.toml

      - name: Deploy to Modal
        working-directory: agent
        run: modal deploy modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
